<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account - PUBG ZONE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#080808;
    color:white;
    min-height:100vh;
}

header{
    background:#111;
    border-bottom:1px solid #333;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#ffc400;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:22px;
    font-weight:bold;
    font-size:14px;
}

nav a:hover{
    color:#ffc400;
}

.container{
    width:90%;
    max-width:700px;
    margin:80px auto;
}

.account-box{
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 30px rgba(255,196,0,0.08);
}

.icon{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#ffc400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:bold;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

.subtitle{
    color:#aaa;
    margin-bottom:30px;
}

.info{
    background:#191919;
    border:1px solid #333;
    border-radius:10px;
    padding:20px;
    margin-bottom:25px;
    text-align:left;
}

.info-title{
    color:#ffc400;
    font-size:13px;
    margin-bottom:8px;
    font-weight:bold;
}

#userEmail{
    font-size:17px;
    word-break:break-word;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#ffc400;
    color:#111;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffdb4d;
}

.back{
    display:block;
    margin-top:20px;
    color:#aaa;
    text-decoration:none;
}

.back:hover{
    color:#ffc400;
}

footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:30px 10px;
    border-top:1px solid #222;
}

@media(max-width:700px){
    header{
        padding:15px 5%;
        flex-direction:column;
        gap:15px;
    }

    nav a{
        margin:0 7px;
        font-size:12px;
    }

    .container{
        margin:50px auto;
    }

    .account-box{
        padding:30px 20px;
    }

    h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">PUBG ZONE</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<div class="container">

    <div class="account-box">

        <div class="icon">👤</div>

        <h1>My Account</h1>

        <p class="subtitle">
            Welcome to PUBG ZONE
        </p>

        <div class="info">

            <div class="info-title">
                LOGGED IN EMAIL
            </div>

            <div id="userEmail">
                Loading...
            </div>

        </div>

        <button id="logoutBtn">
            Logout
        </button>

        <a class="back" href="index.html">
            ← Back to PUBG ZONE
        </a>

    </div>

</div>


<footer>
    © 2026 PUBG ZONE — Gaming Tools & Resources
</footer>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDjXbNWPISsBzkqmyoMEFJ0KFsnkwyltHE",
    authDomain: "pubg-zone-9628a.firebaseapp.com",
    projectId: "pubg-zone-9628a",
    storageBucket: "pubg-zone-9628a.firebasestorage.app",
    messagingSenderId: "144771852887",
    appId: "1:144771852887:web:b59fd929271822088b9112",
    measurementId: "G-KXMDN1EL1F"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const userEmail = document.getElementById("userEmail");

const logoutBtn = document.getElementById("logoutBtn");


onAuthStateChanged(auth, (user) => {

    if(user){

        userEmail.textContent = user.email;

    }else{

        window.location.href = "login.html";

    }

});


logoutBtn.addEventListener("click", async () => {

    try{

        await signOut(auth);

        alert("Logout successful!");

        window.location.href = "index.html";

    }catch(error){

        alert("Logout failed: " + error.message);

    }

});

</script>

</body>
</html>
