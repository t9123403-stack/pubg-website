<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - PUBG ZONE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#080808;
    color:white;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    width:100%;
    padding:20px 7%;
    background:#050505;
    border-bottom:1px solid rgba(255,184,0,0.35);

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:1px;
    color:#ffb800;
}

.logo span{
    color:white;
}

.back-home{
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.back-home:hover{
    color:#ffb800;
}

.login-section{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:60px 20px;
}

.login-box{
    width:100%;
    max-width:450px;

    background:#111;

    border:1px solid #292929;
    border-radius:15px;

    padding:40px 35px;

    box-shadow:
        0 0 35px rgba(255,184,0,0.08);
}

.login-title{
    text-align:center;
    margin-bottom:30px;
}

.login-title small{
    color:#ffb800;
    font-size:12px;
    font-weight:bold;
    letter-spacing:3px;
}

.login-title h1{
    font-size:35px;
    margin-top:10px;
}

.login-title p{
    color:#888;
    font-size:14px;
    margin-top:10px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;

    color:#ddd;
    font-size:14px;
    font-weight:bold;
}

.form-group input{
    width:100%;

    padding:14px;

    background:#080808;

    border:1px solid #333;
    border-radius:7px;

    color:white;

    font-size:15px;

    outline:none;
}

.form-group input:focus{
    border-color:#ffb800;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;

    font-size:13px;
}

.show-password{
    display:flex;
    align-items:center;
    gap:7px;

    color:#aaa;
}

.show-password input{
    width:auto;
}

.forgot{
    color:#ffb800;
    text-decoration:none;
    cursor:pointer;
}

.forgot:hover{
    text-decoration:underline;
}

.login-btn{
    width:100%;

    padding:15px;

    border:none;
    border-radius:7px;

    background:#ffb800;
    color:#111;

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    transition:0.3s;
}

.login-btn:hover{
    background:#ffc933;
    transform:translateY(-2px);
}

.login-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;

    margin-bottom:20px;
    padding:12px;

    border-radius:7px;

    text-align:center;

    font-size:13px;
}

.signup-text{
    text-align:center;

    margin-top:25px;

    color:#888;

    font-size:14px;
}

.signup-text a{
    color:#ffb800;
    text-decoration:none;
    font-weight:bold;
}

.signup-text a:hover{
    text-decoration:underline;
}

.divider{
    display:flex;
    align-items:center;

    gap:10px;

    margin:25px 0;

    color:#555;

    font-size:12px;
}

.divider::before,
.divider::after{
    content:"";

    flex:1;

    height:1px;

    background:#292929;
}

.create-account{
    display:block;

    width:100%;

    padding:13px;

    text-align:center;

    border:1px solid #444;

    border-radius:7px;

    color:white;

    text-decoration:none;

    font-size:14px;

    font-weight:bold;

    transition:0.3s;
}

.create-account:hover{
    border-color:#ffb800;
    color:#ffb800;
}

footer{
    text-align:center;

    padding:25px 20px;

    background:#050505;

    border-top:1px solid #222;

    color:#666;

    font-size:12px;
}

@media(max-width:600px){

    header{
        padding:17px 5%;
    }

    .logo{
        font-size:22px;
    }

    .back-home{
        font-size:12px;
    }

    .login-box{
        padding:30px 22px;
    }

    .login-title h1{
        font-size:30px;
    }

    .options{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        PUBG <span>ZONE</span>
    </div>

    <a href="index.html" class="back-home">
        ← Back to Home
    </a>

</header>


<section class="login-section">

    <div class="login-box">


        <div class="login-title">

            <small>WELCOME BACK</small>

            <h1>Login</h1>

            <p>
                Login to your PUBG ZONE account
            </p>

        </div>


        <div id="message" class="message"></div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="options">

                <label class="show-password">

                    <input
                        type="checkbox"
                        id="showPassword"
                    >

                    Show Password

                </label>


                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                LOGIN
            </button>


        </form>


        <div class="divider">
            OR
        </div>


        <a
            href="signup.html"
            class="create-account"
        >
            CREATE NEW ACCOUNT
        </a>


        <div class="signup-text">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </div>


    </div>

</section>


<footer>

    © 2026 PUBG ZONE — Gaming Tools & Resources

</footer>


<script type="module">


import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyDjXbNWPISsBzkqmyoMEFJ0KFsnkwyltHE",

    authDomain: "pubg-zone-9628a.firebaseapp.com",

    projectId: "pubg-zone-9628a",

    storageBucket: "pubg-zone-9628a.firebasestorage.app",

    messagingSenderId: "144771852887",

    appId: "1:144771852887:web:b59fd929271822088b9112",

    measurementId: "G-KXMDN1EL1F"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const forgotPassword =
    document.getElementById("forgotPassword");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");



function showMessage(text){

    message.textContent = text;

    message.style.display = "block";

}



function hideMessage(){

    message.style.display = "none";

}



showPassword.addEventListener("change", function(){

    if(this.checked){

        passwordInput.type = "text";

    }else{

        passwordInput.type = "password";

    }

});



loginForm.addEventListener("submit", async function(event){

    event.preventDefault();

    hideMessage();

    loginBtn.disabled = true;

    loginBtn.textContent = "LOGGING IN...";


    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        window.location.href = "account.html";


    }catch(error){

        console.log(error);


        let errorMessage =
            "Login failed. Please check your email and password.";


        if(error.code === "auth/invalid-credential"){

            errorMessage =
                "Email or password is incorrect.";

        }

        else if(error.code === "auth/user-not-found"){

            errorMessage =
                "No account found with this email.";

        }

        else if(error.code === "auth/wrong-password"){

            errorMessage =
                "Incorrect password.";

        }

        else if(error.code === "auth/invalid-email"){

            errorMessage =
                "Please enter a valid email.";

        }


        showMessage(errorMessage);


        loginBtn.disabled = false;

        loginBtn.textContent = "LOGIN";

    }

});



forgotPassword.addEventListener("click", async function(event){

    event.preventDefault();


    const email =
        emailInput.value.trim();


    if(!email){

        showMessage(
            "Please enter your email address first."
        );

        emailInput.focus();

        return;

    }


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "Password reset email sent. Please check your inbox."
        );


    }catch(error){

        console.log(error);


        showMessage(
            "Could not send reset email. Please check your email."
        );

    }

});


</script>


</body>
</html>
