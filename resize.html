<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PUBG Zone - Image Resize Tool</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
}

/* HEADER */

header {
    width: 100%;
    padding: 18px 7%;
    background: #111;
    border-bottom: 1px solid #333;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 26px;
    font-weight: 900;
    color: #ffb800;
}

.logo span {
    color: white;
}

.home-btn {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.home-btn:hover {
    color: #ffb800;
}


/* MAIN */

.container {
    width: 90%;
    max-width: 850px;
    margin: 55px auto;
}


/* TITLE */

.title {
    text-align: center;
    margin-bottom: 35px;
}

.title small {
    display: block;
    color: #ffb800;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

.title h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.title p {
    color: #999;
    font-size: 16px;
}


/* TOOL BOX */

.tool-box {
    width: 100%;
    background: #151515;

    border: 1px solid #292929;
    border-radius: 14px;

    padding: 35px;

    overflow: hidden;
}


/* UPLOAD AREA */

.upload-area {
    width: 100%;
    min-height: 280px;

    border: 2px dashed #444;
    border-radius: 12px;

    background: #0e0e0e;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    cursor: pointer;

    transition: 0.3s;
}

.upload-area:hover {
    border-color: #ffb800;
    background: #121212;
}


/* ICON */

.upload-icon {
    font-size: 55px;
    margin-bottom: 18px;
}


/* UPLOAD TEXT */

.upload-area h2 {
    color: #ffb800;
    font-size: 25px;
    margin-bottom: 10px;
}

.upload-area p {
    color: #999;
    font-size: 15px;
    margin-bottom: 22px;
}


/* FILE INPUT */

input[type="file"] {
    display: none;
}


/* CHOOSE BUTTON */

.choose-btn {
    display: inline-block;

    background: #ffb800;
    color: #111;

    padding: 13px 28px;

    border-radius: 6px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.choose-btn:hover {
    background: #ffc933;
    transform: translateY(-2px);
}


/* SETTINGS */

.settings {
    display: none;
    margin-top: 30px;
}


/* PREVIEW */

.preview {
    text-align: center;
    margin-bottom: 25px;
}

.preview img {
    max-width: 100%;
    max-height: 350px;

    border-radius: 8px;
    border: 1px solid #333;
}

.file-name {
    color: #aaa;
    margin-top: 10px;
    font-size: 14px;
}


/* DIMENSIONS */

.dimensions {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 15px;

    margin-bottom: 20px;
}

.input-group label {
    display: block;

    margin-bottom: 8px;

    color: #ccc;
    font-weight: bold;
}

.input-group input {
    width: 100%;

    padding: 13px;

    background: #0d0d0d;

    border: 1px solid #444;

    color: white;

    border-radius: 6px;

    outline: none;
}

.input-group input:focus {
    border-color: #ffb800;
}


/* RESIZE BUTTON */

.resize-btn {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 6px;

    background: #ffb800;

    color: #111;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.resize-btn:hover {
    background: #ffc933;
}


/* RESULT */

.result {
    display: none;

    margin-top: 30px;

    padding-top: 30px;

    border-top: 1px solid #333;

    text-align: center;
}

.result h2 {
    color: #ffb800;
    margin-bottom: 20px;
}

.result img {
    max-width: 100%;
    max-height: 400px;

    border-radius: 8px;

    border: 1px solid #333;

    margin-bottom: 20px;
}


/* DOWNLOAD */

.download-btn {
    display: inline-block;

    background: #ffb800;

    color: #111;

    text-decoration: none;

    padding: 13px 25px;

    border-radius: 6px;

    font-weight: bold;

    transition: 0.3s;
}

.download-btn:hover {
    background: #ffc933;
}


/* INFO */

.info {
    margin-top: 25px;

    padding: 15px;

    background: #101010;

    border-radius: 6px;

    color: #888;

    font-size: 13px;

    line-height: 1.6;

    text-align: center;
}


/* FOOTER */

footer {
    text-align: center;

    color: #666;

    padding: 30px 20px;

    border-top: 1px solid #222;

    margin-top: 50px;
}


/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 15px 5%;
    }

    .logo {
        font-size: 21px;
    }

    .container {
        width: 92%;
        margin-top: 40px;
    }

    .title h1 {
        font-size: 30px;
    }

    .tool-box {
        padding: 20px;
    }

    .upload-area {
        min-height: 250px;
    }

    .dimensions {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        PUBG <span>ZONE</span>
    </div>

    <a href="index.html" class="home-btn">
        ← Back Home
    </a>

</header>



<!-- MAIN -->

<div class="container">


    <!-- TITLE -->

    <div class="title">

        <small>PUBG ZONE TOOL</small>

        <h1>Image Resize Tool</h1>

        <p>
            Resize your gaming images quickly and easily.
        </p>

    </div>



    <!-- TOOL -->

    <div class="tool-box">


        <!-- UPLOAD -->

        <label class="upload-area" for="imageInput">

            <div class="upload-icon">
                🖼️
            </div>

            <h2>
                Select Your Image
            </h2>

            <p>
                Click here to choose JPG, PNG or WEBP image
            </p>

            <span class="choose-btn">
                Choose Image
            </span>

        </label>


        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >



        <!-- SETTINGS -->

        <div class="settings" id="settings">


            <div class="preview">

                <img id="originalPreview">

                <div
                    class="file-name"
                    id="fileName">
                </div>

            </div>



            <div class="dimensions">


                <div class="input-group">

                    <label>
                        Width (px)
                    </label>

                    <input
                        type="number"
                        id="width"
                        min="1"
                    >

                </div>



                <div class="input-group">

                    <label>
                        Height (px)
                    </label>

                    <input
                        type="number"
                        id="height"
                        min="1"
                    >

                </div>

            </div>



            <button
                class="resize-btn"
                onclick="resizeImage()">

                RESIZE IMAGE

            </button>

        </div>



        <!-- RESULT -->

        <div
            class="result"
            id="result">

            <h2>
                ✅ Resized Image
            </h2>

            <img id="resultImage">

            <br>

            <a
                id="downloadBtn"
                class="download-btn"
                download="pubg-zone-resized-image.png">

                ⬇ DOWNLOAD IMAGE

            </a>

        </div>



        <!-- INFO -->

        <div class="info">

            🔒 Your image is processed directly
            in your browser. It is not uploaded
            to our server.

        </div>

    </div>

</div>



<!-- FOOTER -->

<footer>

    © 2026 PUBG Zone — Gaming Tools

</footer>



<script>


let selectedImage = null;


const imageInput =
    document.getElementById("imageInput");

const settings =
    document.getElementById("settings");

const originalPreview =
    document.getElementById("originalPreview");

const fileName =
    document.getElementById("fileName");

const widthInput =
    document.getElementById("width");

const heightInput =
    document.getElementById("height");

const result =
    document.getElementById("result");

const resultImage =
    document.getElementById("resultImage");

const downloadBtn =
    document.getElementById("downloadBtn");



/* SELECT IMAGE */

imageInput.addEventListener(
    "change",
    function() {

        const file = this.files[0];

        if (!file) {
            return;
        }

        selectedImage = file;

        fileName.textContent =
            file.name;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                originalPreview.src =
                    e.target.result;


                const img =
                    new Image();


                img.onload =
                    function() {

                        widthInput.value =
                            img.width;

                        heightInput.value =
                            img.height;

                    };


                img.src =
                    e.target.result;

            };


        reader.readAsDataURL(file);


        settings.style.display =
            "block";

        result.style.display =
            "none";

    }
);



/* RESIZE IMAGE */

function resizeImage() {


    if (!selectedImage) {

        alert(
            "Please select an image first."
        );

        return;
    }


    const newWidth =
        parseInt(widthInput.value);

    const newHeight =
        parseInt(heightInput.value);


    if (
        !newWidth ||
        !newHeight ||
        newWidth < 1 ||
        newHeight < 1
    ) {

        alert(
            "Please enter valid width and height."
        );

        return;
    }



    const reader =
        new FileReader();


    reader.onload =
        function(e) {


            const img =
                new Image();


            img.onload =
                function() {


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        newWidth;

                    canvas.height =
                        newHeight;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        newWidth,
                        newHeight
                    );


                    const resizedImage =
                        canvas.toDataURL(
                            "image/png"
                        );


                    resultImage.src =
                        resizedImage;


                    downloadBtn.href =
                        resizedImage;


                    result.style.display =
                        "block";


                    result.scrollIntoView({
                        behavior: "smooth"
                    });

                };


            img.src =
                e.target.result;

        };


    reader.readAsDataURL(
        selectedImage
    );

}

</script>


</body>
</html>
