<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - PUBG ZONE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#0b0f14;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px
}
.signup-box{
width:100%;
max-width:430px;
background:#121821;
border:1px solid #28313d;
border-radius:14px;
padding:35px 30px;
box-shadow:0 0 30px rgba(0,0,0,.5)
}
.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#f5c400;
margin-bottom:8px
}
.subtitle{
text-align:center;
color:#9aa4b2;
margin-bottom:30px;
font-size:14px
}
h2{text-align:center;margin-bottom:25px;font-size:24px}
label{
display:block;
margin-bottom:8px;
color:#d9dee5;
font-size:14px
}
input{
width:100%;
padding:13px;
margin-bottom:18px;
border:1px solid #303a47;
border-radius:8px;
background:#0d131b;
color:white;
outline:none;
font-size:15px
}
input:focus{border-color:#f5c400}
.password-option{
display:flex;
align-items:center;
gap:8px;
margin-top:-8px;
margin-bottom:20px;
color:#9aa4b2;
font-size:13px
}
.password-option input{
width:auto;
margin:0
}
button{
width:100%;
padding:14px;
border:0;
border-radius:8px;
background:#f5c400;
color:#111;
font-size:16px;
font-weight:bold;
cursor:pointer
}
button:hover{background:#ffd52a}
.login-text{
text-align:center;
margin-top:22px;
color:#9aa4b2;
font-size:14px
}
.login-text a{
color:#f5c400;
text-decoration:none;
font-weight:bold
}
.back{
display:block;
text-align:center;
margin-top:20px;
color:#9aa4b2;
text-decoration:none;
font-size:14px
}
.footer{
text-align:center;
margin-top:25px;
color:#66717f;
font-size:12px
}
</style>
</head>

<body>

<div class="signup-box">

<div class="logo">PUBG ZONE</div>
<div class="subtitle">Gaming Tools • Guides • Tips</div>

<h2>Create Account</h2>

<form id="signupForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Create a password" required minlength="6">

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="6">

<div class="password-option">
<input type="checkbox" id="showPassword">
<span>Show Password</span>
</div>

<button type="submit">Create Account</button>

</form>

<div class="login-text">
Already have an account?
<a href="login.html">Login</a>
</div>

<a class="back" href="index.html">← Back to PUBG ZONE</a>

<div class="footer">
© 2026 PUBG ZONE. All rights reserved.
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
updateProfile
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDjXbNWPISsBzkqmyoMEFJ0KFsnkwyltHE",
authDomain: "pubg-zone-9628a.firebaseapp.com",
projectId: "pubg-zone-9628a",
storageBucket: "pubg-zone-9628a.firebasestorage.app",
messagingSenderId: "144771852887",
appId: "1:144771852887:web:b59fd929271822088b9112",
measurementId: "G-KXMDN1EL1F"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("showPassword").addEventListener("change", function(){

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

password.type = this.checked ? "text" : "password";
confirmPassword.type = this.checked ? "text" : "password";

});

document.getElementById("signupForm").addEventListener("submit", async function(event){

event.preventDefault();

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if(password !== confirmPassword){
alert("Passwords do not match!");
return;
}

try{

const userCredential = await createUserWithEmailAndPassword(
auth,
email,
password
);

await updateProfile(userCredential.user,{
displayName:name
});

alert("Account created successfully!");

window.location.href = "login.html";

}catch(error){

if(error.code === "auth/email-already-in-use"){
alert("This email already has an account.");
}
else if(error.code === "auth/weak-password"){
alert("Password must be at least 6 characters.");
}
else if(error.code === "auth/invalid-email"){
alert("Please enter a valid email address.");
}
else{
alert("Account creation failed: " + error.message);
}

}

});

</script>

</body>
</html>
